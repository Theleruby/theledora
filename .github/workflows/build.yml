---
name: Build container images
run-name: ${{ github.event_name == 'pull_request' && format('[#{0}] {1}', github.event.pull_request.number, github.event.pull_request.title)
           || github.event_name == 'schedule' && 'Daily build'
           || github.event_name == 'push' && github.event.head_commit.message
           || github.event_name == 'workflow_dispatch' && 'Manual build'
           || '' }}
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '10 10 * * *'  # 10:10am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "theledora, a customized fedora bootc image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  GITHUB_RUN_NAME: ${{ github.event_name == 'pull_request' && format('[#{0}] {1}', github.event.pull_request.number, github.event.pull_request.title)
                    || github.event_name == 'schedule' && 'Daily build'
                    || github.event_name == 'push' && github.event.head_commit.message
                    || github.event_name == 'workflow_dispatch' && 'Manual build'
                    || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name }}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push images
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        #type: [desktop, gamescope]
        #variant: [desktop-nvidia-open, gamescope]
        #parent_image: [bazzite-nvidia-open, bazzite-deck]
        #tag: [stable-43, stable-44]
        #tag2: [stable, none]
        #tag3: [latest, none]
        #fedora_version: [43, 44]
        #fedora_edition: [silverblue, kinoite]
        #release_type: [stable, lts, development, experiment]
        include:
        #- type: desktop
        #  variant: desktop-nvidia-open
        #  parent_image: bazzite-nvidia-open
        #  tag: stable-43
        #  tag2: none
        #  tag3: none
        #  fedora_version: 43
        #  fedora_edition: kinoite
        #  release_type: stable
        - type: desktop
          variant: desktop-nvidia-open
          parent_image: bazzite-nvidia-open
          tag: stable-44
          tag2: stable
          tag3: none
          fedora_version: 44
          fedora_edition: kinoite
          release_type: stable
        - type: desktop
          variant: desktop-nvidia-open
          parent_image: bazzite-nvidia-open
          tag: testing-44
          tag2: testing
          tag3: none
          fedora_version: 44
          fedora_edition: kinoite
          release_type: development
        - type: gamescope
          variant: gamescope
          parent_image: bazzite-deck
          tag: stable-43
          tag2: stable
          tag3: none
          fedora_version: 43
          fedora_edition: kinoite
          release_type: stable
        - type: gamescope
          variant: gamescope
          parent_image: bazzite-deck
          tag: testing-44
          tag2: testing
          tag3: none
          fedora_version: 44
          fedora_edition: kinoite
          release_type: development

    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
          echo "date_short=$(date -u +%Y\%m\%d)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          tags: |
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag }}.${{ steps.date.outputs.date_short }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag }}.${{ steps.date.outputs.date_short }}.${{ github.run_number }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag2 }},enable=${{ matrix.tag2 != 'none' }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag2 }}.${{ steps.date.outputs.date_short }},enable=${{ matrix.tag2 != 'none' }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag2 }}.${{ steps.date.outputs.date_short }}.${{ github.run_number }},enable=${{ matrix.tag2 != 'none' }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag3 }},enable=${{ matrix.tag3 != 'none' }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag3 }}.${{ steps.date.outputs.date_short }},enable=${{ matrix.tag3 != 'none' }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.tag3 }}.${{ steps.date.outputs.date_short }}.${{ github.run_number }},enable=${{ matrix.tag3 != 'none' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ matrix.variant }}-${{ matrix.tag }}.${{ steps.date.outputs.date_short }}.${{ github.run_number }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          build-args: |
            MATRIX_TYPE=${{ matrix.type }}
            MATRIX_VARIANT=${{ matrix.variant }}
            MATRIX_PARENT_IMAGE=${{ matrix.parent_image }}
            MATRIX_TAG=${{ matrix.tag }}
            MATRIX_FEDORA_EDITION=${{ matrix.fedora_edition }}
            MATRIX_FEDORA_VERSION=${{ matrix.fedora_version }}
            MATRIX_RELEASE_TYPE=${{ matrix.release_type }}
            GITHUB_BRANCH=${{ steps.extract_branch.outputs.branch }}
            BUILD_DATE=${{ steps.date.outputs.date_short }}
            BUILD_RUN_NUMBER=${{ github.run_number }}
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false

      # Rechunk is a script that we use on Universal Blue to make sure there isnt a single huge layer when your image gets published.
      # This does not make your image faster to download, just provides better resumability and fixes a few errors.
      # Documentation for Rechunk is provided on their github repository at https://github.com/hhd-dev/rechunk
      # You can enable it by uncommenting the following lines:
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710 # v1.0.0
      #   with:
      #     rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
      #     ref: "localhost/${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ matrix.tag }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ matrix.tag }}"
      #     skip_compression: true
      #     version: ${{ env.CENTOS_VERSION }}
      #     labels: ${{ steps.metadata.outputs.labels }} # Rechunk strips out all the labels during build, this needs to be reapplied here with newline separator

      # This is necessary so that the podman socket can find the rechunked image on its storage
      # - name: Load in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      - name: Publish changelog to TUPS
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          ctr=$(buildah from "$IMAGE_NAME:${{ matrix.variant }}-${{ matrix.tag }}")
          trap 'buildah rm "$ctr" >/dev/null 2>&1 || true' EXIT
          buildah run "$ctr" -- bash -c 'dnf5 repoquery --installed --queryformat "%{name}/%{version}/%{release}/%{arch}\n"' > packages.txt
          upstream_image_id=$(buildah run "$ctr" -- bash -c 'source /etc/os-release && printf "%s" "$UPSTREAM_IMAGE_ID"')
          jq -n \
          --arg id "${{ env.IMAGE_NAME }}-${{ matrix.variant }}-${{ matrix.tag }}.${{ steps.date.outputs.date_short }}.${{ github.run_number }}" \
          --arg image "${{ env.IMAGE_NAME }}" \
          --arg branch "${{ steps.extract_branch.outputs.branch }}" \
          --arg event_name "${{ github.event_name }}" \
          --arg run_name "$GITHUB_RUN_NAME" \
          --arg run_number "${{ github.run_number }}" \
          --arg sha "${{ github.sha }}" \
          --arg date "${{ steps.date.outputs.date }}" \
          --arg type "${{ matrix.type }}" \
          --arg variant "${{ matrix.variant }}" \
          --arg tag "${{ matrix.tag }}" \
          --arg tag2 "${{ matrix.tag2 }}" \
          --arg tag3 "${{ matrix.tag3 }}" \
          --arg fedora_version "${{ matrix.fedora_version }}" \
          --arg fedora_edition "${{ matrix.fedora_edition }}" \
          --arg release_type "${{ matrix.release_type }}" \
          --arg date_short "${{ steps.date.outputs.date_short }}" \
          --arg upstream_image_id "$upstream_image_id" \
          '{
              id: $id,
              image: $image,
              branch: $branch,
              event_name: $event_name,
              run_name: $run_name,
              run_number: ($run_number | tonumber),
              sha: $sha,
              date: $date,
              type: $type,
              variant: $variant,
              tag: $tag,
              tag2: $tag2,
              tag3: $tag3,
              fedora_version: ($fedora_version | tonumber),
              fedora_edition: $fedora_edition,
              release_type: $release_type,
              date_short: $date_short,
              upstream_image_id: $upstream_image_id
          }' > metadata.json
          curl --fail-with-body --header "Authorization: Bearer ${{ secrets.TUPS_API_TOKEN }}" --request POST --form 'data=<metadata.json;type=application/json' --form 'file=@packages.txt;type=text/plain' https://tups.theleruby.com/api/publish
